<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BAcubeTimer</title>
<style>
:root{
  --bg:#111;
  --time:#00ff00;
}
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:var(--bg);
  color:var(--time);
  font-family:Arial, sans-serif;
}
h1{
  color:white;
  margin-bottom:20px;
}
#time{
  font-size:80px;
}
#hint{
  color:#aaa;
  margin-top:10px;
}
.settings{
  position:fixed;
  bottom:10px;
  color:white;
}
input{
  margin-left:5px;
}
</style>
</head>
<body>

<h1>BAcubeTimer</h1>
<div id="time">0.000</div>
<div id="hint">Giữ SPACE → thả để bắt đầu</div>

<div class="settings">
  Nền <input type="color" id="bg" value="#111111">
  Số <input type="color" id="timeColor" value="#00ff00">
</div>

<script>
let startTime = 0;
let running = false;
let ready = false;
let interval;

const timeEl = document.getElementById("time");
const hint = document.getElementById("hint");

function format(ms){
  return (ms/1000).toFixed(3);
}

document.addEventListener("keydown", e=>{
  if(e.code === "Space" && !running){
    e.preventDefault();
    ready = true;
    timeEl.style.color = "red";
    hint.innerText = "Thả SPACE để bắt đầu";
  }
});

document.addEventListener("keyup", e=>{
  if(e.code === "Space"){
    e.preventDefault();
    if(!running && ready){
      start();
      ready = false;
    }else if(running){
      stop();
    }
  }
});

function start(){
  running = true;
  startTime = Date.now();
  timeEl.style.color = getComputedStyle(document.documentElement)
    .getPropertyValue('--time');
  hint.innerText = "Nhấn SPACE để dừng";
  interval = setInterval(()=>{
    timeEl.innerText = format(Date.now() - startTime);
  },10);
}

function stop(){
  running = false;
  clearInterval(interval);
  hint.innerText = "Giữ SPACE để giải tiếp";
}

document.getElementById("bg").oninput = e=>{
  document.documentElement.style.setProperty("--bg", e.target.value);
};
document.getElementById("timeColor").oninput = e=>{
  document.documentElement.style.setProperty("--time", e.target.value);
  timeEl.style.color = e.target.value;
};
</script>

</body>
</html>
