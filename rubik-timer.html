<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BAcubeTimer</title>
<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
header {
    font-size: 28px;
    padding: 15px;
    font-weight: bold;
}
#timer {
    font-size: 90px;
    margin: 20px 0;
}
#message {
    font-size: 22px;
    min-height: 30px;
}
#scramble {
    font-size: 18px;
    margin: 10px;
}
canvas {
    background: #222;
    margin: 10px auto;
    display: block;
}
button {
    padding: 10px 16px;
    margin: 5px;
    font-size: 16px;
}
</style>
</head>

<body>

<header>BAcubeTimer</header>

<div id="scramble"></div>

<canvas id="cube" width="180" height="140"></canvas>

<div id="timer">0.00</div>
<div id="message">Giữ SPACE để chuẩn bị</div>

<button onclick="resetTimer()">Reset</button>

<audio id="win" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>
<audio id="lose" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
let running = false;
let ready = false;
let startTime = 0;
let raf;
let times = [];

const timerEl = document.getElementById("timer");
const msgEl = document.getElementById("message");

document.addEventListener("keydown", e => {
    if (e.code === "Space" && !running) {
        ready = true;
        msgEl.innerText = "Thả SPACE để bắt đầu";
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    if (e.code === "Space") {
        if (!running && ready) {
            startTimer();
        } else if (running) {
            stopTimer();
        }
        e.preventDefault();
    }
});

function startTimer() {
    ready = false;
    running = true;
    startTime = performance.now();
    msgEl.innerText = "Đang chạy...";
    loop();
}

function loop() {
    if (!running) return;
    let t = (performance.now() - startTime) / 1000;
    timerEl.innerText = t.toFixed(2);
    raf = requestAnimationFrame(loop);
}

function stopTimer() {
    running = false;
    cancelAnimationFrame(raf);
    let t = (performance.now() - startTime) / 1000;
    timerEl.innerText = t.toFixed(2);
    evaluate(t);
    newScramble();
}

function resetTimer() {
    running = false;
    ready = false;
    timerEl.innerText = "0.00";
    msgEl.innerText = "Giữ SPACE để chuẩn bị";
}

function evaluate(t) {
    let msg = "";
    let sound = "win";

    if (t <= 5) msg = "KỈ LỤC THẾ GIỚI À =))";
    else if (t <= 10) msg = "Trời ơi đỉnh dữ vậy";
    else if (t <= 15) msg = "Ê quá ghê rồi á";
    else if (t <= 20) msg = "Ối dồi ôi ghê vậy";
    else if (t <= 25) msg = "Ghê vậy ba";
    else if (t <= 35) msg = "Cũng ghê phết nhờ";
    else if (t <= 40) msg = "Mới bắt đầu học F2L hả";
    else {
        msg = "Ê học F2L đi nha";
        sound = "lose";
    }

    msgEl.innerText = msg;
    document.getElementById(sound).play();
}

function newScramble() {
    const moves = ["R","R'","L","L'","U","U'","D","D'","F","F'","B","B'"];
    let s = [];
    for (let i=0;i<20;i++) {
        s.push(moves[Math.floor(Math.random()*moves.length)]);
    }
    document.getElementById("scramble").innerText =
        "Scramble: " + s.join(" ");
    drawCube();
}

/* VẼ CUBE 2D MÔ PHỎNG */
function drawCube() {
    const c = document.getElementById("cube");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height);

    const colors = ["white","yellow","red","orange","blue","green"];
    let i = 0;

    function face(x,y) {
        for (let r=0;r<3;r++) {
            for (let col=0;col<3;col++) {
                ctx.fillStyle = colors[i%6];
                ctx.fillRect(x+col*18, y+r*18, 16, 16);
                i++;
            }
        }
    }

    face(60,0);   // U
    face(0,60);   // L
    face(60,60);  // F
    face(120,60); // R
    face(60,120); // D
}

newScramble();
</script>

</body>
</html>
