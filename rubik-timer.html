<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BAcubeTimer</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}
header{
    font-size:28px;
    padding:15px;
    font-weight:bold;
}
#scramble{
    font-size:18px;
    margin:10px;
}
#timer{
    font-size:90px;
    margin:20px 0;
}
#message{
    min-height:28px;
    font-size:22px;
}
button{
    padding:8px 14px;
    margin:4px;
    font-size:15px;
    cursor:pointer;
}
.panel{
    max-width:620px;
    margin:10px auto;
    border:1px solid #333;
    padding:10px;
}
ul{
    text-align:left;
    max-height:160px;
    overflow:auto;
}
canvas{
    display:block;
    margin:10px auto;
}
</style>
</head>

<body>

<header>BAcubeTimer</header>

<div id="scramble"></div>
<button onclick="newScramble()">🔄 Reset Scramble</button>

<canvas id="cube" width="180" height="160"></canvas>

<div id="timer">0.00</div>
<div id="message">Giữ SPACE để chuẩn bị</div>

<button onclick="resetTimer()">⏹ Reset Timer</button>

<div class="panel">
<h3>🎨 Màu sắc</h3>
Nền <input type="color" onchange="document.body.style.background=this.value">
Chữ <input type="color" onchange="document.body.style.color=this.value">
</div>

<div class="panel">
<h3>📊 Thống kê</h3>
<ul id="history"></ul>
<button onclick="clearAll()">🗑 Xóa hết</button>
</div>

<!-- ÂM THANH -->
<audio id="good" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>
<audio id="bad"  src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* ================== BIẾN ================== */
let running=false;
let ready=false;
let startTime=0;
let raf=null;
let times=[];

const timer=document.getElementById("timer");
const message=document.getElementById("message");
const history=document.getElementById("history");

/* ================== TIMER ================== */
document.addEventListener("keydown",e=>{
 if(e.code==="Space" && !running){
   ready=true;
   message.innerText="Thả SPACE để bắt đầu";
   e.preventDefault();
 }
});

document.addEventListener("keyup",e=>{
 if(e.code==="Space"){
   if(!running && ready) start();
   else if(running) stop();
   e.preventDefault();
 }
});

function start(){
 ready=false;
 running=true;
 startTime=performance.now();
 message.innerText="Đang chạy...";
 loop();
}

function loop(){
 if(!running) return;
 timer.innerText=((performance.now()-startTime)/1000).toFixed(2);
 raf=requestAnimationFrame(loop);
}

function stop(){
 running=false;
 cancelAnimationFrame(raf);
 let t=(performance.now()-startTime)/1000;
 timer.innerText=t.toFixed(2);
 evaluate(t);
 save(t);
 newScramble();
}

function resetTimer(){
 running=false;
 ready=false;
 cancelAnimationFrame(raf);
 timer.innerText="0.00";
 message.innerText="Giữ SPACE để chuẩn bị";
}

/* ================== ĐÁNH GIÁ ================== */
function evaluate(t){
 let msg="", sound="good";
 if(t<=5) msg="KỈ LỤC THẾ GIỚI À =))";
 else if(t<=10) msg="Trời ơi đỉnh đỉnh đỉnh vậy";
 else if(t<=15) msg="Ê quá ghê rồi á nha";
 else if(t<=20) msg="Ối dồi ôi ghê vậy";
 else if(t<=25) msg="Ghê vậy ba";
 else if(t<=35) msg="Cũng ghê phết nhờ";
 else if(t<=40) msg="Mới bắt đầu học F2L hả";
 else{ msg="Ê học F2L đi nha"; sound="bad"; }
 message.innerText=msg;
 document.getElementById(sound).currentTime=0;
 document.getElementById(sound).play();
}

/* ================== THỐNG KÊ ================== */
function save(t){
 times.push(t);
 renderStats();
}

function renderStats(){
 history.innerHTML="";
 times.forEach((t,i)=>{
  let li=document.createElement("li");
  li.innerHTML=`${t.toFixed(2)}s 
  <button onclick="del(${i})">🗑</button>`;
  history.appendChild(li);
 });
}

function del(i){
 times.splice(i,1);
 renderStats();
}

function clearAll(){
 times=[];
 renderStats();
}

/* ================== SCRAMBLE ================== */
const MOVES=["R","R'","L","L'","U","U'","D","D'","F","F'","B","B'"];

function newScramble(){
 let s=[];
 for(let i=0;i<20;i++){
  s.push(MOVES[Math.floor(Math.random()*MOVES.length)]);
 }
 document.getElementById("scramble").innerText="Scramble: "+s.join(" ");
 drawCube();
}

/* ================== VẼ CUBE (MÔ PHỎNG) ================== */
function drawCube(){
 const ctx=document.getElementById("cube").getContext("2d");
 ctx.clearRect(0,0,180,160);

 const COLORS=["#ffffff","#ffff00","#00ff00","#ff0000","#ff8800","#0066ff"];

 function rand(){
  return COLORS[Math.floor(Math.random()*COLORS.length)];
 }

 function face(x,y){
  for(let r=0;r<3;r++){
   for(let c=0;c<3;c++){
    ctx.fillStyle=rand();
    ctx.fillRect(x+c*18,y+r*18,16,16);
    ctx.strokeStyle="#000";
    ctx.strokeRect(x+c*18,y+r*18,16,16);
   }
  }
 }

 // U
 face(60,0);
 // L F R
 face(0,60);
 face(60,60);
 face(120,60);
 // D
 face(60,120);
}

/* ================== INIT ================== */
newScramble();
</script>

</body>
</html>
