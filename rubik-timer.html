<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BAcubetimer</title>
<style>
body{
 margin:0;
 font-family:Arial;
 background:#0b0b0b;
 color:white;
 text-align:center;
}
h1{margin:10px}

#timer{
 font-size:80px;
 margin:20px;
}

#scramble{
 font-size:20px;
 margin:10px;
 word-break:break-word;
}

canvas{
 background:#111;
 margin:auto;
 display:block;
}

button{
 padding:10px 15px;
 margin:5px;
 font-size:16px;
 cursor:pointer;
}

#msg{
 font-size:18px;
 margin-top:10px;
}

#stats{
 margin-top:15px;
 font-size:14px;
}
</style>
</head>

<body>
<h1>BAcubetimer</h1>

<button onclick="enableSound()">🔊 Bật âm thanh</button>
<button onclick="resetAll()">🗑 Reset tất cả</button>

<div id="scramble"></div>

<canvas id="cube" width="320" height="260"></canvas>

<div id="timer">0.00</div>
<div id="msg">Giữ SPACE để bắt đầu</div>

<div id="stats"></div>

<audio id="win" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>
<audio id="lose" src="https://assets.mixkit.co/sfx/preview/mixkit-losing-drums-2023.mp3"></audio>

<script>
let running=false;
let startTime=0;
let interval;
let soundEnabled=false;
let times=[];

function enableSound(){
 document.getElementById("win").play().catch(()=>{});
 soundEnabled=true;
 alert("Âm thanh đã bật");
}

function resetAll(){
 times=[];
 document.getElementById("stats").innerHTML="";
 newScramble();
 drawCube();
}

function randomScramble(){
 let m=["R","L","U","D","F","B"];
 let s="";
 for(let i=0;i<20;i++){
  s+=m[Math.floor(Math.random()*6)]+" ";
 }
 return s;
}

function newScramble(){
 document.getElementById("scramble").innerText="Scramble: "+randomScramble();
}
newScramble();

document.addEventListener("keydown",e=>{
 if(e.code==="Space" && !running){
  running=true;
  startTime=Date.now();
  interval=setInterval(update,10);
 }
});

document.addEventListener("keyup",e=>{
 if(e.code==="Space" && running){
  running=false;
  clearInterval(interval);
  let t=(Date.now()-startTime)/1000;
  times.push(t);
  showMsg(t);
  updateStats();
  newScramble();
 }
});

function update(){
 let t=(Date.now()-startTime)/1000;
 document.getElementById("timer").innerText=t.toFixed(2);
}

function showMsg(t){
 let msg="";
 let sound="win";
 if(t<=5) msg="KỈ LỤC THẾ GIỚI À =))";
 else if(t<=10) msg="TRỜI ƠI ĐỈNH ĐỈNH ĐỈNH";
 else if(t<=15) msg="QUÁ GHÊ RỒI NHA";
 else if(t<=20) msg="ỐI DỒI ÔI GHÊ VẬY";
 else if(t<=25) msg="GHÊ VẬY BA";
 else if(t<=35) msg="CŨNG GHÊ PHẾT NHỜ";
 else if(t<=40){ msg="MỚI HỌC F2L HẢ"; sound="lose";}
 else { msg="Ê HỌC F2L ĐI NHA"; sound="lose"; }

 document.getElementById("msg").innerText=msg;
 if(soundEnabled) document.getElementById(sound).play();
}

function updateStats(){
 let html="Thống kê:<br>";
 times.forEach((t,i)=>{
  html+=`${i+1}. ${t.toFixed(2)}s ❌<br>`;
 });
 document.getElementById("stats").innerHTML=html;
}

function drawCube(){
 const c=document.getElementById("cube");
 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);

 const size=40;
 const ox=120, oy=20;

 const colors={
  U:"white", D:"yellow",
  F:"green", B:"blue",
  L:"orange", R:"red"
 };

 function face(x,y,color){
  ctx.fillStyle=color;
  ctx.fillRect(x,y,size,size);
  ctx.strokeStyle="black";
  ctx.strokeRect(x,y,size,size);
 }

 // U
 face(ox+size,oy,colors.U);
 face(ox+2*size,oy,colors.U);
 face(ox+size,oy+size,colors.U);
 face(ox+2*size,oy+size,colors.U);

 // L F R
 face(ox,oy+2*size,colors.L);
 face(ox+size,oy+2*size,colors.F);
 face(ox+2*size,oy+2*size,colors.R);

 face(ox,oy+3*size,colors.L);
 face(ox+size,oy+3*size,colors.F);
 face(ox+2*size,oy+3*size,colors.R);

 // D (KHÔNG BỊ CỤT)
 face(ox+size,oy+4*size,colors.D);
 face(ox+2*size,oy+4*size,colors.D);
 face(ox+size,oy+5*size,colors.D);
 face(ox+2*size,oy+5*size,colors.D);
}
drawCube();
</script>
</body>
</html>
